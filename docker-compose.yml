# InovaFit - Sistema com PostgreSQL 17, Oracle XE 21, testes e aplicações em Java
#
# docker-compose up -d --wait                                                                                     # Sobe os dois bancos de dados com todas as suas informações;
# docker-compose run --rm testes                                                                                  # Realiza todos os testes em Java nos dois bancos de dados;
# docker compose --profile apps run --rm app-java                                                                 # Inicializa a aplicação Java;
# docker compose --profile apps run --rm app-java mvn clean compile exec:java -Dexec.mainClass=MedirPerformance   # Executa os testes de performance do InovaFit
# docker compose --profile testes run --rm testes mvn test -Dtest=MutantesTest                                    # Realiza os testes de mutação;
# docker compose down -v                                                                                          # Apaga os dados do banco de dados, mas na próxima que o mesmo for subido, os scripts são recarregados.

# As senhas que estão explicítas abaixo são apenas utilizadas em laboratório.
services:
  postgres:
    image: postgres:17
    container_name: inovafit-postgres
    environment:
      POSTGRES_DB: inovafit
      POSTGRES_USER: inovafit
      POSTGRES_PASSWORD: inovafit_lab
    ports: ["5432:5432"]
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    - ./postgresql:/scripts/postgresql:ro
    - ./procedures:/scripts/procedures:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inovafit -d inovafit"]
      interval: 10s
      timeout: 5s
      retries: 20

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: inovafit-oracle
    environment:
      ORACLE_PASSWORD: oracle_lab_password
      APP_USER: inovafit
      APP_USER_PASSWORD: inovafit_lab
    ports: ["1521:1521"]
    volumes:
    - oradata:/opt/oracle/oradata
    - ./docker/oracle-init:/container-entrypoint-initdb.d:ro
    - ./oracle:/scripts/oracle:ro
    - ./procedures:/scripts/procedures:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30

    
  testes:
    build:
      context: .
      dockerfile: docker/dockerfile.testes
    profiles: ["testes"]
    depends_on:
      postgres:
        condition: service_healthy
      oracle:
        condition: service_healthy
    volumes:
      - .:/workspace
    environment: &conexoes
      PG_URL: jdbc:postgresql://postgres:5432/inovafit
      PG_USER: inovafit
      PG_PASSWORD: inovafit_lab
      ORA_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      ORA_USER: inovafit
      ORA_PASSWORD_APP: inovafit_lab

  
  app-java:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      PG_URL: jdbc:postgresql://postgres:5432/inovafit
      PG_USER: inovafit
      PG_PASSWORD: inovafit_lab
      ORA_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      ORA_USER: inovafit
      ORA_PASSWORD_APP: inovafit_lab
    command: ["mvn", "-q", "compile", "exec:java"]
    depends_on:
      postgres:
        condition: service_healthy
      oracle:
        condition: service_healthy
    profiles: ["apps"]

volumes:
  pgdata:
  oradata:
  maven-repo: