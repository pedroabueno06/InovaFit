# InovaFit - Sistema com PostgreSQL 17, Oracle XE 21, testes e aplicações em Java
#
# docker-compose up -d --wait                                                                                     # Sobe os dois bancos de dados com todas as suas informações;
# docker-compose run --rm testes                                                                                  # Realiza todos os testes em Java nos dois bancos de dados;
# docker compose --profile apps run --rm app-java                                                                 # Inicializa a aplicação Java;
# docker compose --profile apps run --rm app-java mvn clean compile exec:java -Dexec.mainClass=MedirPerformance   # Executa os testes de performance do InovaFit
# mvn exec:java -Dexec.mainClass=mutacao.ExecutarMutacoes -Dexec.classpathScope=test                              # Realiza os testes de mutação;
# docker compose down -v                                                                                          # Apaga os dados do banco de dados, mas na próxima vez que o mesmo for subido, os scripts são recarregados.

# As senhas que estão explícitas abaixo são apenas utilizadas em laboratório.
services:

## Banco de dados PostgreSQL
  postgres:
    image: postgres:17
    container_name: inovafit-postgres
    environment:
      POSTGRES_DB: inovafit
      POSTGRES_USER: inovafit
      POSTGRES_PASSWORD: inovafit_lab
    ports: ["5433:5432"]
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    - ./postgresql:/scripts/postgresql:ro
    - ./procedures:/scripts/procedures:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inovafit -d inovafit"]
      interval: 10s
      timeout: 5s
      retries: 20

  traefik:
    image: traefik:v3.6
    container_name: inovafit-traefik
    hostname: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=inovafit_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inovafit-pgadmin
    hostname: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin4.localhost`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"

## Banco de dados Oracle
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: inovafit-oracle
    environment:
      ORACLE_PASSWORD: oracle_lab_password
      APP_USER: inovafit
      APP_USER_PASSWORD: inovafit_lab
    ports: ["1521:1521"]
    volumes:
    - oradata:/opt/oracle/oradata
    - ./docker/oracle-init:/container-entrypoint-initdb.d:ro
    - ./oracle:/scripts/oracle:ro
    - ./procedures:/scripts/procedures:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30

    
  testes:
    build:
      context: .
      dockerfile: docker/dockerfile.testes
    profiles: ["testes"]
    depends_on:
      postgres:
        condition: service_healthy
      oracle:
        condition: service_healthy
    volumes:
      - .:/workspace
    environment: &conexoes
      PG_URL: jdbc:postgresql://postgres:5432/inovafit
      PG_USER: inovafit
      PG_PASSWORD: inovafit_lab
      ORA_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      ORA_USER: inovafit
      ORA_PASSWORD_APP: inovafit_lab

  
  app-java:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      PG_URL: jdbc:postgresql://postgres:5432/inovafit
      PG_USER: inovafit
      PG_PASSWORD: inovafit_lab
      ORA_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      ORA_USER: inovafit
      ORA_PASSWORD_APP: inovafit_lab
    command: ["mvn", "-q", "compile", "exec:java"]
    depends_on:
      postgres:
        condition: service_healthy
      oracle:
        condition: service_healthy
    profiles: ["apps"]

volumes:
  pgdata:
  oradata:
  maven-repo:
  pgadmin_data:
